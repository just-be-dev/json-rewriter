[tools]
bun = "1.3.1"

[settings]
experimental = true
pin = true

[hooks]
postinstall = "bun install"

[env]
_.path = "node_modules/.bin"

[tasks.test]
description = "Run the test suite"
run = "bun test"

[tasks.typecheck]
description = "Type-check without emitting"
run = "bunx tsc --noEmit"

[tasks.bench]
description = "Run streaming rewrite benchmarks"
run = "bun benchmarks/bench.ts"

[tasks.memory]
description = "Run the memory profiling test on its own"
run = "bun test memory.test.ts"

[tasks.perf]
description = "Run the opt-in performance test"
run = "PERF=1 bun test performance.test.ts"

[tasks.regression]
description = "Run the performance + memory regression gate against committed baselines"
run = "REGRESSION=1 bun test regression.test.ts"

[tasks.update-baselines]
description = "Regenerate regression/baselines.json from the current code"
run = "UPDATE_BASELINES=1 REGRESSION=1 bun test regression.test.ts"
